# Tests d'intégration Electron (harnais réel sous xvfb).
#
# Non bloquant : le harnais Electron/xvfb est plus fragile en CI que les
# tests unitaires purs. Il s'exécute sur dev et main mais n'est pas requis
# pour le merge — il signale les régressions sans bloquer la livraison.
name: Tests Electron (intégration)

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  tests-electron:
    name: Harnais Electron (xvfb)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Installation de xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Tests d'intégration Electron
        run: npm run test:electron
        continue-on-error: true

      - name: Fumée du binaire packagé (Linux)
        run: |
          npm run dist:linux || true
          xvfb-run -a node test-electron/smoke-packaged.js || true
        continue-on-error: true
